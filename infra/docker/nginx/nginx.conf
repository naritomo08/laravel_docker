user  nginx;
worker_processes  auto;

error_log  /dev/stderr notice;
pid        /var/run/nginx.pid;


events {
    worker_connections  1024;
}


http {
    server_tokens off;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format access_json escape=json
        '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
        '"method":"$request_method","uri":"$request_uri","status":$status,'
        '"body_bytes_sent":$body_bytes_sent,"request_time":$request_time,'
        '"upstream_addr":"$upstream_addr","user_agent":"$http_user_agent"}';

    map $request_uri $loggable_request {
        default 1;
        ~^/health 0;
        ~^/favicon\.ico 0;
        ~^/robots\.txt 0;
        ~^/manifest\.json 0;
        ~^/apple-touch-icon 0;
        ~^/\.well-known/ 0;
        ~*\.(css|js|map|png|jpe?g|gif|svg|ico|webp|woff2?|ttf|eot)(\?.*)?$ 0;
    }

    access_log  /dev/stdout access_json if=$loggable_request;

    sendfile        on;
    tcp_nopush      on;

    keepalive_timeout  65;

    gzip  on;
    gzip_types text/css application/javascript application/json;

    include /etc/nginx/conf.d/*.conf;
}