volumes:
  php-fpm-socket:
  pg-store:
  pg-test-store:
  cache_volume:
  public-storage:

services:
  app:
    build:
      context: .
      dockerfile: ./infra/docker/php/Dockerfile
    restart: unless-stopped
    command: >
      sh -lc "mkdir -p /work/backend/storage/app/public/images
      && chown -R www-data:www-data /work/backend/storage/app/public
      && chmod -R u=rwX,g=rX,o=rX /work/backend/storage/app/public
      && php-fpm"
    env_file:
      - ./backend/.env
    volumes:
      - php-fpm-socket:/var/run/php-fpm
      - public-storage:/work/backend/storage/app/public
    environment:
      - APP_ENV=${APP_ENV:-local}
      - DB_CONNECTION=pgsql
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-laravel_local}
      - DB_USERNAME=${DB_USERNAME:-phper}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - MAIL_MAILER=${MAIL_MAILER:-smtp}
      - QUEUE_CONNECTION=${QUEUE_CONNECTION:-redis}
      - REDIS_HOST=cache
      - REDIS_PASSWORD=null
      - REDIS_PORT=6379

  scheduler:
    build:
      context: .
      dockerfile: ./infra/docker/php/Dockerfile
    env_file:
      - ./backend/.env
    command: php artisan schedule:work
    working_dir: /work/backend
    restart: unless-stopped
    depends_on:
      - app
      - db
      - cache
    environment:
      - APP_ENV=${APP_ENV:-local}
      - DB_CONNECTION=pgsql
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-laravel_local}
      - DB_USERNAME=${DB_USERNAME:-phper}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - MAIL_MAILER=${MAIL_MAILER:-smtp}
      - QUEUE_CONNECTION=${QUEUE_CONNECTION:-redis}
      - REDIS_HOST=cache
      - REDIS_PASSWORD=null
      - REDIS_PORT=6379

  queue:
    build:
      context: .
      dockerfile: ./infra/docker/php/Dockerfile
    env_file:
      - ./backend/.env
    command: php artisan queue:work redis --tries=6 --delay=60
    working_dir: /work/backend
    restart: unless-stopped
    depends_on:
      - app
      - db
      - cache
    environment:
      - APP_ENV=${APP_ENV:-local}
      - DB_CONNECTION=pgsql
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-laravel_local}
      - DB_USERNAME=${DB_USERNAME:-phper}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - MAIL_MAILER=${MAIL_MAILER:-smtp}
      - QUEUE_CONNECTION=${QUEUE_CONNECTION:-redis}
      - REDIS_HOST=cache
      - REDIS_PASSWORD=null
      - REDIS_PORT=6379

  web:
    build:
      context: .
      dockerfile: ./infra/docker/nginx/Dockerfile
    restart: unless-stopped
    volumes:
      - php-fpm-socket:/var/run/php-fpm
      - public-storage:/work/backend/storage/app/public
    ports:
      - target: 80
        published: ${WEB_PORT:-8080}
        protocol: tcp
        mode: host

  db:
    image: postgres:16-bookworm
    env_file:
      - ./backend/.env
    restart: unless-stopped
    ports:
      - target: 5432
        published: ${DB_PUBLISHED_PORT:-5433}
        protocol: tcp
        mode: host
    volumes:
      - type: volume
        source: pg-store
        target: /var/lib/postgresql/data
        volume:
          nocopy: true
    environment:
      - POSTGRES_DB=${DB_DATABASE:-laravel_local}
      - POSTGRES_USER=${DB_USERNAME:-phper}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-secret}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-phper} -d ${DB_DATABASE:-laravel_local}"]
      retries: 3
      start_period: 5s

  db.test:
    image: postgres:16-bookworm
    env_file:
      - ./backend/.env
    restart: unless-stopped
    volumes:
      - type: volume
        source: pg-test-store
        target: /var/lib/postgresql/data
        volume:
          nocopy: true
    environment:
      POSTGRES_DB: '${DB_TEST_DATABASE:-laravel_test}'
      POSTGRES_USER: '${DB_USERNAME:-phper}'
      POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-phper} -d ${DB_TEST_DATABASE:-laravel_test}"]
      retries: 3
      start_period: 5s

  selenium:
    image: seleniarm/standalone-chromium
    ports:
      - "4444:4444"
    shm_size: '2gb'
    restart: unless-stopped

  cache:
    image: redis:6.2.4-alpine
    volumes:
      - type: volume
        source: cache_volume
        target: /data
        volume:
          nocopy: true
    restart: unless-stopped

  laravel_adminer:
    image: adminer:4.8.0
    ports:
        - "8081:8080"
    depends_on:
        - db
        - db.test
    restart: unless-stopped

  laravel_mailhog:
    platform: linux/x86_64
    image: mailhog/mailhog
    ports:
        - "1025:1025"
        - "8025:8025"
    restart: unless-stopped

networks:
  default:
    ipam:
      config:
        - subnet: ${VPC_CIDR:-171.32.0.0/16}
